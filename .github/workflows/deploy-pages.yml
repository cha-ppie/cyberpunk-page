name: Deploy Vue site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export published content
        if: ${{ vars.PAGES_CONTENT_API_URL != '' }}
        env:
          PAGES_CONTENT_API_URL: ${{ vars.PAGES_CONTENT_API_URL }}
        run: npm run content:export

      - name: Set up Python for gallery thumbnails
        if: ${{ hashFiles('content/published.json') != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate gallery thumbnails for published content
        if: ${{ hashFiles('content/published.json') != '' }}
        run: |
          python -m pip install Pillow
          python scripts/generate-gallery-thumbnails.py

      - name: Build Vue site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
