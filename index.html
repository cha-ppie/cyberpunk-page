<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cyberpunk 夜之城资料站，整理 Cyberpunk 2077 的世界观、系统、攻略、边缘行者与视觉档案。">
    <title>Cyberpunk / 夜之城资料站</title>
    <style>
      .local-launch-note {
        display: none;
        min-height: 100vh;
        padding: 48px 24px;
        color: #e5e7ea;
        background: #030507;
        font-family: "Microsoft YaHei", sans-serif;
      }

      .local-launch-note.is-visible { display: grid; place-items: center; }
      .local-launch-note__card { max-width: 640px; border-left: 4px solid #fcee09; padding: 28px; background: #10161d; }
      .local-launch-note h1 { margin: 0 0 16px; color: #fcee09; letter-spacing: .08em; }
      .local-launch-note code { color: #00f0ff; }
    </style>
  </head>
  <body data-theme="home">
    <div id="app"></div>
    <section id="local-launch-note" class="local-launch-note" aria-live="polite">
      <div class="local-launch-note__card">
        <h1>需要通过本地服务器启动</h1>
        <p>此项目已使用 Vue 3 和 Vite，不能通过双击 <code>index.html</code> 直接运行。</p>
        <p>请在项目目录打开 PowerShell，执行：</p>
        <p><code>npm run dev</code></p>
        <p>然后在浏览器打开终端显示的本地地址。</p>
      </div>
    </section>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('local-launch-note').classList.add('is-visible')
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
